# Render Blueprint: New → Blueprint → pick this repo.
# Creates the web service (Docker) and a Postgres database, and wires DATABASE_URL.
# You'll be prompted for the three API keys (sync: false) on first deploy.

services:
  - type: web
    name: darpan
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # 512 MB RAM
    region: singapore # closest Render region to India
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darpan-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

databases:
  - name: darpan-db
    plan: basic-256mb
    region: singapore
    databaseName: darpan
